name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PRAMAN_LLM_MODE: offline  # tests replay recorded model answers; no network, no keys
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is there a frontend yet?
        id: check
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm test
      - name: Build
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm run build
