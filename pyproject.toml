[project]
name = "praman"
version = "0.1.0"
description = "Praman: an agent that checks green claims on product pages for proof under India's rules"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "selectolax",
    "pillow",
    "pdfplumber",
    "pandas",
    "rapidfuzz",
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
    "sse-starlette>=3.5.0",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "rapidocr-onnxruntime>=1.4.4",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["praman"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "frontend", "graphify-out", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
